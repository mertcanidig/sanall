<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#0a0f1c;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
#c{display:block;position:fixed;inset:0;touch-action:none;z-index:1}
#loader{position:fixed;inset:0;background:linear-gradient(180deg,#0a0f1c,#1a0f28);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#dff3ff;gap:18px;transition:opacity .5s}
#loader.hide{opacity:0;pointer-events:none}
#loaderTitle{font-size:22px;font-weight:900;letter-spacing:.2em;background:linear-gradient(180deg,#a8e7ff,#4c8dff);-webkit-background-clip:text;background-clip:text;color:transparent}
#loaderBar{width:min(300px,80vw);height:6px;background:rgba(90,140,220,.2);border-radius:99px;overflow:hidden}

#loaderText{font-size:12px;color:#8fb4dd;text-align:center;padding:0 20px}
#topbar{position:fixed;top:0;left:0;right:0;height:52px;background:linear-gradient(180deg,rgba(18,26,48,.96),rgba(18,26,48,.72));backdrop-filter:blur(10px);border-bottom:1px solid rgba(90,140,220,.35);display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#dff3ff;z-index:10;font-size:13px;gap:10px}
#logo{font-weight:900;letter-spacing:.12em;font-size:15px;background:linear-gradient(180deg,#a8e7ff,#4c8dff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(80,160,255,.7));white-space:nowrap}
#roomInfo{display:flex;align-items:center;gap:14px;font-size:12px;color:#8fb4dd}
#roomInfo b{color:#7dd3fc}
#coinCount{color:#fbbf24!important}
#topActions{display:flex;gap:8px}
.topBtn{height:34px;padding:0 14px;border-radius:17px;border:1px solid rgba(90,140,220,.4);background:rgba(30,45,80,.7);color:#c8dcf4;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.topBtn:hover{background:rgba(59,130,246,.35);color:#fff}
.topBtn.primary{background:linear-gradient(180deg,#8ee7ff,#3b82f6);color:#04101f;border:none}
.topBtn.gold{background:linear-gradient(180deg,#fde68a,#f59e0b);color:#1a1000;border:none}
@media(max-width:600px){.topBtn .lbl{display:none}}
#charPanel,#shopPanel{position:fixed;top:64px;right:14px;width:min(320px,calc(100vw - 28px));max-height:calc(100vh - 150px);overflow-y:auto;background:linear-gradient(180deg,rgba(18,26,48,.97),rgba(14,20,38,.97));border:1px solid rgba(90,140,220,.4);border-radius:16px;padding:16px;color:#dff3ff;z-index:20;backdrop-filter:blur(12px);transform:translateX(380px);opacity:0;pointer-events:none;transition:all .3s}
#shopPanel{border-color:rgba(245,158,11,.5);background:linear-gradient(180deg,rgba(28,20,48,.97),rgba(20,12,38,.97));color:#fff3d6;z-index:21}

.panelTitle{font-size:13px;font-weight:800;letter-spacing:.12em;color:#7dd3fc;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panelTitle::before{content:"";width:4px;height:14px;border-radius:2px;background:linear-gradient(180deg,#7dd3fc,#3b82f6)}

#chat{position:fixed;left:14px;bottom:74px;width:min(320px,calc(100vw - 28px));max-height:140px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;padding:10px;border-radius:14px;background:rgba(10,16,32,.5);backdrop-filter:blur(8px);border:1px solid rgba(90,140,220,.2);font-size:13px;line-height:1.4;pointer-events:none;z-index:6}

#toast{position:fixed;top:72px;left:50%;transform:translateX(-50%) translateY(-16px);padding:10px 20px;border-radius:22px;background:linear-gradient(180deg,rgba(59,130,246,.95),rgba(37,99,235,.95));color:#fff;font-weight:700;font-size:13px;z-index:30;opacity:0;pointer-events:none;transition:all .3s;white-space:nowrap}

#roomBanner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

#emoteTray.open{display:grid}
#emoteTray button{height:42px;border-radius:10px;border:1px solid rgba(90,140,220,.25);background:rgba(30,45,80,.7);font-size:20px;cursor:pointer}
#joy{display:none;position:fixed;left:18px;bottom:84px;width:120px;height:120px;border-radius:50%;z-index:9;touch-action:none;background:rgba(30,45,80,.35);border:1px solid rgba(125,211,252,.35)}
#joyKnob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 35% 30%,#c4f1ff,#3b82f6)}
#interactHint{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:18px;background:rgba(18,26,48,.9);border:1px solid rgba(125,211,252,.45);color:#dff3ff;font-size:13px;font-weight:700;z-index:15;opacity:0;pointer-events:none;transition:opacity .2s}
#interactHint.show{opacity:1}
:root{--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--kb:0px}
html,body{height:100dvh;overscroll-behavior:none}
#topbar{padding-top:var(--safe-t);height:calc(52px + var(--safe-t))}
#charPanel,#shopPanel{top:calc(64px + var(--safe-t))}
#toast{top:calc(72px + var(--safe-t))}
body.typing #joy{display:none}
@media(max-width:700px),(pointer:coarse){
#logo{font-size:13px}.topBtn{height:36px;padding:0 12px}
#chat{top:calc(60px + var(--safe-t));left:10px;bottom:auto;width:calc(100vw - 24px);max-height:90px;font-size:12px}
#bottombar{height:calc(62px + var(--safe-b));padding-bottom:var(--safe-b);transform:translateY(calc(-1 * var(--kb)))}
#chatInput{font-size:16px}#joy{display:block}
#charPanel,#shopPanel{top:auto;left:0;right:0;bottom:0;width:100%;max-height:55dvh;border-radius:20px 20px 0 0;padding-bottom:calc(16px + var(--safe-b));transform:translateY(100%)}
#charPanel.open,#shopPanel.open{transform:translateY(0)}
#emoteTray{bottom:calc(74px + var(--safe-b))}
#interactHint{bottom:calc(90px + var(--safe-b))}
}
#error{position:fixed;inset:0;background:#1a0a0a;color:#fca5a5;padding:20px;font-family:monospace;font-size:13px;z-index:300;display:none;overflow:auto;white-space:pre-wrap}
</style>

<script type="importmap">
{"imports":{

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as skeletonClone } from 'three/addons/utils/SkeletonUtils.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'threePass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

window.addEventListener('error', e => {
  const el = document.getElementById('error');
  if (el) { el.style.display = 'block'; el.textContent += e.message + '\n' + (e.error?.stack||'') + '\n\n'; }
});

/* ================================================================
   ⚙️ MODEL YAPILANDIRMASI
   ================================================================
   girl.glb dosyanız: models/characters/girl.glb
   Başka model eklerseniz buraya satır ekleyin.
*/
const MODEL_CONFIG = {
  characters: {
    girl: 'models/characters/girl.glb'    // ← SİZİN MODELİNİZ
  }
};

/* GLB modelinizdeki materyal isimleri (Blender'da veya
   https://gltf-viewer.donmccurdy.com adresinde görün) bu kelimeleri
   içeriyorsa otomatik renklendirilir. Modelinizde renk değiştirmek
   istemiyorsanız bu kısmı olduğu gibi bırakın (isim eşleşmezse dokunulmaz). */
const MATERIAL_KEYWORDS = {
  skin:  ['skin', 'body', 'face', 'head'],
  hair:  ['hair'],
  shirt: ['shirt', 'top', 'dress', 'cloth', 'tshirt'],
  pants: ['pants', 'leg', 'lower', 'skirt', 'jeans']
};

/* Modelinizdeki animasyon isimleri bu kelimeleri içeriyorsa
   otomatik algılanır. Model statikse animasyon yok — sorun değil. */
const ANIM_KEYWORDS = {
  idle: ['idle', 'bekle', 'stand'],
  walk: ['walk', 'yürü', 'run', 'jog']
};

/* Karakterin dünya boyu (metre) */
const CHAR_TARGET_HEIGHT = 1.75;

/* ================================================================
   RENDERER & SAHNE
   ================================================================ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1a1230, 0.012);

const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 300);
camera.position.set(12, 14, 12);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.46;
controls.minDistance = 6;
controls.maxDistance = 30;
controls.target.set(0, 0.5, 0);
controls.enablePan = false;

const pmrem = new THREE.PMREMGenerator(renderer);
const envMap = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envMap;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.28, 0.55, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* Gökyüzü */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: {
    topColor:    { value: new THREE.Color(0x0a1028) },
    midColor:    { value: new THREE.Color(0x2c1a4a) },
    bottomColor: { value: new THREE.Color(0x6a3a5a) }
  },
  vertexShader: `varying vec3 vW; void main(){ vW=(modelMatrix*vec4(position,1.)).xyz; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader: `uniform vec3 topColor,midColor,bottomColor; varying vec3 vW;
    void main(){ float h=normalize(vW).y; vec3 c;
      if(h>.2) c=mix(midColor,topColor,smoothstep(.2,.9,h));
      else c=mix(bottomColor,midColor,smoothstep(-.4,.2,h));
      gl_FragColor=vec4(c,1.);}`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(150, 32, 16), skyMat));

/* Işıklar */
scene.add(new THREE.HemisphereLight(0xb8d4ff, 0x2a1a30, 0.55));
const sun = new THREE.DirectionalLight(0xfff0d0, 1.5);
sun.position.set(18, 26, 12);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 80;
sun.shadow.camera.left = -30; sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30; sun.shadow.camera.bottom = -30;
sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.02;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x8090d0, 0.5);
rim.position.set(-14, 10, -12);
scene.add(rim);

/* ================================================================
   MODEL YÜKLEYİCİ
   ================================================================ */
const loaderEl = document.getElementById('loader');
const loaderFill = document.getElementById('loaderFill');
const loaderText = document.getElementById('loaderText');

const gltfLoader = new GLTFLoader();

/* Yüklenen modeller burada tutulur */
const modelCache = {};

function updateLoader(progress, text) {
  loaderFill.style.width = (progress * 100) + '%';
  loaderText.textContent = text || `Yükleniyor... ${Math.round(progress*100)}%`;
}

function loadGLB(url) {
  return new Promise((resolve, reject) => {
    gltfLoader.load(url, resolve, (progress) => {
      if (progress.total) {
        updateLoader(progress.loaded / progress.total, `Yükleniyor: ${url.split('/').pop()} (${Math.round(progress.loaded/progress.total*100)}%)`);
      }
    }, reject);
  });
}

async function preloadAllModels() {
  const entries = Object.entries(MODEL_CONFIG.characters).filter(([_, url]) => url);
  if (entries.length === 0) { updateLoader(1, 'Model yok — prosedürel karakter'); return; }

  let loaded = 0;
  for (const [key, url] of entries) {
    updateLoader(loaded / entries.length, `Yükleniyor: ${url}`);
    try {
      const gltf = await loadGLB(url);
      modelCache[key] = gltf;
      console.log(`%c✓ Model yüklendi: ${key}`, 'color: #22c55e; font-weight: bold', gltf);
      // Animasyon isimlerini konsola yaz
      if (gltf.animations && gltf.animations.length > 0) {
        console.log(`  🎬 Animasyonlar:`, gltf.animations.map(a => a.name).join(', '));
      } else {
        console.warn(`  ⚠ "${key}" modelinde animasyon yok — karakter kayar gibi hareket edecek`);
      }
      // Materyal isimlerini konsola yaz
      const mats = new Set();
      gltf.scene.traverse(o => {
        if (o.isMesh && o.material) {
          const ms = Array.isArray(o.material) ? o.material : [o.material];
          ms.forEach(m => mats.add(m.name || '(isimsiz)'));
        }
      });
      console.log(`  🎨 Materyaller:`, [...mats].join(', '));
    } catch (err) {
      console.error(`%c✗ Model yüklenemedi: ${url}`, 'color: #ef4444; font-weight: bold', err);
      console.warn('  → Prosedürel karakter kullanılacak');
    }
    loaded++;
  }
  updateLoader(1, 'Hazır!');
}

/* Model klonlama (SkeletonUtils ile — animasyonlu karakterler için doğru yöntem) */
function cloneModel(source) {
  return skeletonClone(source);
}

/* Modeldeki mesh'leri gölge alacak şekilde ayarla */
function enableShadows(model) {
  model.traverse(obj => {
    if (obj.isMesh) {
      obj.castShadow = true;
      obj.receiveShadow = true;
      if (obj.material) {
        const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
        mats.forEach(m => {
          if (m.envMapIntensity !== undefined) m.envMapIntensity = 0.9;
        });
      }
    }
  });
}

/* Modeli hedef boya göre ölçekle ve yere oturt */
function fitModelToTarget(model, targetHeight) {
  const box = new THREE.Box3().setFromObject(model);
  const size = new THREE.Vector3();
  box.getSize(size);
  if (size.y > 0) {
    const scale = targetHeight / size.y;
    model.scale.multiplyScalar(scale);
  }
  const box2 = new THREE.Box3().setFromObject(model);
  model.position.y -= box2.min.y;
}

/* Materyal renk tonu uygula */
function tintMaterials(model, partColors) {
  model.traverse(obj => {
    if (!obj.isMesh || !obj.material) return;
    const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
    mats.forEach(mat => {
      const nameLower = (mat.name || '').toLowerCase();
      for (const [part, keywords] of Object.entries(MATERIAL_KEYWORDS)) {
        if (keywords.some(kw => nameLower.includes(kw))) {
          if (partColors[part] !== undefined) {
            mat.color = new THREE.Color(partColors[part]);
          }
          break;
        }
      }
    });
  });
}

/* ================================================================
   GLB KARAKTER OLUŞTURMA
   ================================================================ */
function createCharacterFromGLB(cached, playerState, modelKey) {
  const root = cloneModel(cached.scene);

  // Animasyonları hazırla
  let mixer = null;
  const actions = {};
  if (cached.animations && cached.animations.length > 0) {
    mixer = new THREE.AnimationMixer(root);
    cached.animations.forEach(clip => {
      const action = mixer.clipAction(clip);
      const nameLower = clip.name.toLowerCase();
      let type = null;
      for (const [t, kws] of Object.entries(ANIM_KEYWORDS)) {
        if (kws.some(kw => nameLower.includes(kw))) { type = t; break; }
      }
      if (type) actions[type] = action;
    });
    // Idle'ı başlat
    if (actions.idle) {
      actions.idle.play();
    } else if (cached.animations[0]) {
      actions.idle = mixer.clipAction(cached.animations[0]);
      actions.idle.play();
    }
  }

  // Ölçekle, yere oturt, gölge
  fitModelToTarget(root, CHAR_TARGET_HEIGHT);
  tintMaterials(root, {
    skin: playerState.skin,
    hair: playerState.hair,
    shirt: playerState.shirt,
    pants: playerState.pants
  });
  enableShadows(root);

  root.userData = {
    isGLB: true,
    modelKey,
    mixer,
    actions,
    currentAction: actions.idle || null,
    opts: { ...playerState }
  };

  return root;
}

function mat(color, opts = {}) {
  const m = new THREE.MeshStandardMaterial({
    color: new THREE.Color(color),
    roughness: opts.rough ?? 0.7,
    metalness: opts.metal ?? 0.05,
    transparent: opts.transparent ?? false,
    opacity: opts.opacity ?? 1
  });
  if (opts.emissive !== undefined) {
    m.emissive = new THREE.Color(opts.emissive);
    m.emissiveIntensity = opts.emissiveIntensity ?? 0.8;
  }
  return m;
}

function createCharacter(playerState, characterKey) {
  // characterKey: 'girl' veya 'male' veya undefined

function makeTileFloor(w, h, cA, cB, cPath) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.PlaneGeometry(w + 2, h + 2), mat(cB, { rough: 0.92 }));
  base.rotation.x = -Math.PI/2; base.position.y = -0.01; base.receiveShadow = true; g.add(base);
  const tileGeo = new THREE.BoxGeometry(0.98, 0.06, 0.98);
  for (let x = 0; x < w; x++) {
    for (let z = 0; z < h; z++) {
      const isPath = (x === Math.floor(w/2) || z === Math.floor(h/2));
      const c = isPath ? cPath : ((x + z) % 2 === 0 ? cA : cB);
      const m = new THREE.Mesh(tileGeo, mat(c, { rough: 0.85 }));
      m.position.set(x - w/2 + 0.5, 0.03, z - h/2 + 0.5);
      m.receiveShadow = true;

  return g;

let currentRoomId = 'lobi';
const roomRoot = new THREE.Group();
scene.add(roomRoot);
const sitables = [];
const portals = [];
const coins3d = [];
let fireflies = null;

function makeFireflies(count, rX, rZ) {
  const g = new THREE.Group();
  for (let i = 0; i < count; i++) {
    const f = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 6),
      new THREE.MeshBasicMaterial({ color: 0xfff1a0, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }));
    f.position.set(rand(-rX, rX), rand(0.5, 3), rand(-rZ, rZ));
    f.userData = { phase: Math.random()*Math.PI*2, speed: 0.3 + Math.random()*0.6, baseY: f.position.y, angle: Math.random()*Math.PI*2 };
    g.add(f);
  }
  return g;
}

function loadRoom(id) {
  if (npcGroup) { roomRoot.remove(npcGroup); npcGroup = null; }
  while (roomRoot.children.length) roomRoot.remove(roomRoot.children[0]);
  sitables.length = 0; portals.length = 0; coins3d.length = 0;
  const def = ROOM_DEFS[id];
  currentRoomId = id;
  def.build(roomRoot);
  roomRoot.traverse(obj => {
    if (obj.userData?.sit) sitables.push(obj);
    if (obj.userData?.portal) portals.push(obj);
  });
  const halfW = def.w/2 - 2, halfH = def.h/2 - 2;
  for (let i = 0; i < 8; i++) {
    const cx = rand(-halfW, halfW), cz = rand(-halfH, halfH);
    if (Math.hypot(cx, cz) < 2.5) continue;
    const c = makeCoin(cx, cz);
    roomRoot.add(c);
    coins3d.push(c);
  }
  if (fireflies) roomRoot.remove(fireflies);
  fireflies = makeFireflies(25, halfW, halfH);
  roomRoot.add(fireflies);
  spawnNPCs(id);
  document.getElementById('roomName').textContent = def.name;
}

const NPC_NAMES = ['Ayşe','Mehmet','Zeynep','Ali','Fatma','Can','Elif','Burak','Selin','Emre','Deniz','Mert','Aslı','Kerem','Buse'];
let npcGroup = null;
const npcs = [];

function spawnNPCs(roomId) {
  const def = ROOM_DEFS[roomId];
  npcGroup = new THREE.Group();
  npcs.length = 0;
  const count = 5 + Math.floor(Math.random() * 4);
  for (let i = 0; i < count; i++) {
    const name = NPC_NAMES[i % NPC_NAMES.length];
    const state = {
      gender: 'female',
      skin: 0xfcd9b8, hair: 0x2d1b0f,
      shirt: [0x4f8ef7,0xec4899,0x10b981,0xa855f7,0xf59e0b,0xef4444][i%6],
      pants: 0x1f2b48
    };
    const npc = createCharacter(state, 'girl');
    const hw = def.w/2 - 2, hh = def.h/2 - 2;
    let x, z, tries = 0;
    do {
      x = rand(-hw, hw); z = rand(-hh, hh);
      tries++;
    } while (Math.hypot(x, z) < 3 && tries < 20);
    npc.position.x = x;
    npc.position.z = z;
    npc.rotation.y = Math.random() * Math.PI * 2;
    npc.userData.npc = { name, walkTimer: rand(2, 6), targetX: x, targetZ: z, moving: false };
    npcGroup.add(npc);
    npcs.push(npc);
  }
  roomRoot.add(npcGroup);
}

function updateNPCs(dt) {
  for (const npc of npcs) {
    const data = npc.userData.npc;
    if (!data) continue;
    data.walkTimer -= dt;
    if (data.walkTimer <= 0) {
      data.walkTimer = rand(3, 7);
      const hw = ROOM_DEFS[currentRoomId].w/2 - 2;
      const hh = ROOM_DEFS[currentRoomId].h/2 - 2;
      data.targetX = rand(-hw, hw);
      data.targetZ = rand(-hh, hh);
      data.moving = true;
      const ud = npc.userData;
      if (ud.isGLB && ud.actions && ud.actions.walk && ud.currentAction !== ud.actions.walk) {
        if (ud.currentAction) ud.currentAction.fadeOut(0.3);
        ud.actions.walk.reset().fadeIn(0.3).play();
        ud.currentAction = ud.actions.walk;
      }
    }
    if (data.moving) {
      const dx = data.targetX - npc.position.x;
      const dz = data.targetZ - npc.position.z;
      const d = Math.hypot(dx, dz);
      if (d < 0.2) {
        data.moving = false;
        const ud = npc.userData;
        if (ud.isGLB && ud.actions && ud.actions.idle && ud.currentAction !== ud.actions.idle) {
          if (ud.currentAction) ud.currentAction.fadeOut(0.3);
          ud.actions.idle.reset().fadeIn(0.3).play();
          ud.currentAction = ud.actions.idle;
        }
      } else {
        const speed = 1.6 * dt;
        npc.position.x += (dx / d) * speed;
        npc.position.z += (dz / d) * speed;
        npc.rotation.y = Math.atan2(dx, dz);
      }
    }
  }
}

const joyEl = document.getElementById('joy'), joyKnob = document.getElementById('joyKnob');
let joyId = null;
function joyMove(e) {
  const r = joyEl.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
  let dx = e.clientX - cx, dy = e.clientY - cy;
  const max = r.width/2 - 12, d = Math.hypot(dx, dy);
  if (d > max) { dx = dx/d * max; dy = dy/d * max; }
  joyKnob.style.transform = `translate(${dx}px,${dy}px)`;
  joyX = dx/max; joyY = dy/max;
  if (Math.hypot(joyX, joyY) < 0.15) { joyX = 0; joyY = 0; }
}
function joyEnd(e) { if (e.pointerId !== joyId) return; joyId = null; joyX = 0; joyY = 0; joyKnob.style.transform = ''; }
joyEl.addEventListener('pointerdown', e => { joyId = e.pointerId; joyEl.setPointerCapture(e.pointerId); joyMove(e); e.preventDefault(); });
joyEl.addEventListener('pointermove', e => { if (e.pointerId === joyId) joyMove(e); });
joyEl.addEventListener('pointerup', joyEnd); joyEl.addEventListener('pointercancel', joyEnd);

function trySit() {
  if (playerState.sitting) { standUp(); return; }
  let best = null, bestD = 2.2;
  for (const s of sitables) {
    const d = Math.hypot(player.position.x - s.position.x, player.position.z - s.position.z);
    if (d < bestD) { bestD = d; best = s; }
  }
  if (best) doSit(best);
}
function doSit(obj) {
  playerState.sitting = true; playerState.sitTarget = obj;
  player.position.x = obj.position.x; player.position.z = obj.position.z;
  player.position.y = (obj.userData.sitY || 0.5) - 0.75;
  playerState.walkPhase = 0;
  showToast('🪑 Oturdun — kalkmak için E');
  earnCoins(3, 'dinlenme');
}
function standUp() {
  if (!playerState.sitting) return;
  playerState.sitting = false; playerState.sitTarget = null;
  player.position.y = 0; player.position.x += 0.6; player.position.z += 0.6;

/* ================================================================
   UPDATE
   ================================================================ */
const clock = new THREE.Clock();
let coinWalk = 0;
let totalTime = 0;

function roomBounds() {
  const def = ROOM_DEFS[currentRoomId];
  return { halfW: def.w/2 - 0.7, halfH: def.h/2 - 0.7 };
}

function update(dt) {
  totalTime += dt;

  if (playerState.sitting) {
    if (playerState.emoteTimer > 0) playerState.emoteTimer -= dt; else playerState.emote = null;
  } else {
    let ix = 0, iz = 0;
    if (keys['w'] || keys['arrowup']) iz -= 1;
    if (keys['s'] || keys['arrowdown']) iz += 1;
    if (keys['a'] || keys['arrowleft']) ix -= 1;
    if (keys['d'] || keys['arrowright']) ix += 1;
    ix += joyX; iz += joyY;

    const moving = (ix || iz);

    if (moving) {
      const len = Math.hypot(ix, iz) || 1;
      ix /= len; iz /= len;
      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir); camDir.y = 0; camDir.normalize();
      const right = new THREE.Vector3().crossVectors(camDir, new THREE.Vector3(0, 1, 0)).normalize();
      const move = new THREE.Vector3();
      move.addScaledVector(right, ix);
      move.addScaledVector(camDir, -iz);
      move.normalize().multiplyScalar(playerState.speed * dt);

      const nx = player.position.x + move.x;
      const nz = player.position.z + move.z;
      const b = roomBounds();
      player.position.x = clamp(nx, -b.halfW, b.halfW);
      player.position.z = clamp(nz, -b.halfH, b.halfH);
      player.rotation.y = Math.atan2(move.x, move.z);
      playerState.walkPhase += dt * 8;
      coinWalk += Math.hypot(move.x, move.z);
      if (coinWalk > 12) { coinWalk = 0; playerState.coins += 5; updateCoinUI(); }

      const ud = player.userData;
      // GLB varsa walk animasyonuna geç
      if (ud.isGLB && ud.actions && ud.actions.walk && ud.currentAction !== ud.actions.walk) {
        if (ud.currentAction) ud.currentAction.fadeOut(0.2);
        ud.actions.walk.reset().fadeIn(0.2).play();
        ud.currentAction = ud.actions.walk;
      } else if (!ud.isGLB && ud.leftLeg) {
        const phase = playerState.walkPhase;
        ud.leftLeg.rotation.x  = Math.sin(phase) * 0.55;
        ud.rightLeg.rotation.x = Math.sin(phase + Math.PI) * 0.55;
        ud.leftArm.rotation.x  = Math.sin(phase + Math.PI) * 0.5;
        ud.rightArm.rotation.x = Math.sin(phase) * 0.5;
        player.position.y = Math.abs(Math.sin(phase * 2)) * 0.04;
      }
    } else {
      playerState.walkPhase = 0;
      const ud = player.userData;
      if (ud.isGLB && ud.actions && ud.actions.idle && ud.currentAction !== ud.actions.idle) {
        if (ud.currentAction) ud.currentAction.fadeOut(0.2);
        ud.actions.idle.reset().fadeIn(0.2).play();
        ud.currentAction = ud.actions.idle;
      } else if (!ud.isGLB) {
        player.position.y = 0;
        if (ud.leftLeg) {
          ud.leftLeg.rotation.x = 0; ud.rightLeg.rotation.x = 0;
          ud.leftArm.rotation.x = 0; ud.rightArm.rotation.x = 0;
        }
      }
    }
  }

  // Altınlar
  for (let i = coins3d.length - 1; i >= 0; i--) {
    const c = coins3d[i];
    c.position.y = Math.sin(totalTime * 2 + c.userData.bob) * 0.15;
    c.rotation.y += dt * 2.5;
    if (c.userData.coinMesh) c.userData.coinMesh.rotation.z = totalTime * 1.5;
    if (Math.hypot(player.position.x - c.position.x, player.position.z - c.position.z) < 0.9) {
      earnCoins(c.userData.value, 'yerden toplandı');
      roomRoot.remove(c); coins3d.splice(i, 1);
    }
  }

  // Portallar
  for (const p of portals) {
    if (p.userData.particles) {
      p.userData.particles.children.forEach(part => {
        part.position.y = 0.2 + ((totalTime * 0.6 + part.userData.phase) % 2.5);
        const ph = part.userData.phase + totalTime * 1.5;
        part.position.x = Math.cos(ph) * part.userData.r;
        part.position.z = Math.sin(ph) * part.userData.r;
      });
    }
    if (p.userData.ring1) p.userData.ring1.rotation.z = totalTime * 0.6;
    if (p.userData.ring2) p.userData.ring2.rotation.z = -totalTime * 0.9;
    if (Math.hypot(player.position.x - p.position.x, player.position.z - p.position.z) < 1.3) {
      switchRoom(p.userData.target); return;
    }
  }

  roomRoot.traverse(obj => {
    if (obj.userData?.fountain) {
      if (obj.userData.water) obj.userData.water.position.y = 0.4 + Math.sin(totalTime*3)*0.015;
      if (obj.userData.orb) {
        obj.userData.orb.position.y = 2.15 + Math.sin(totalTime*2)*0.06;
        obj.userData.orb.rotation.y = totalTime;
      }
    }
  });

  if (fireflies) {
    fireflies.children.forEach(f => {
      const ud = f.userData;
      ud.angle += dt * ud.speed * 0.5;
      f.position.x += Math.cos(ud.angle + ud.phase) * dt * 0.6;
      f.position.z += Math.sin(ud.angle + ud.phase) * dt * 0.6;
      f.position.y = ud.baseY + Math.sin(totalTime * ud.speed * 2 + ud.phase) * 0.4;
      f.material.opacity = 0.5 + Math.abs(Math.sin(totalTime * 2 + ud.phase)) * 0.5;
    });
  }

  updateNPCs(dt);

  // Animasyon mixer'ları
  if (player.userData?.mixer) player.userData.mixer.update(dt);
  for (const npc of npcs) {
    if (npc.userData?.mixer) npc.userData.mixer.update(dt);
  }

  let nearSit = false;
  if (!playerState.sitting) {
    for (const s of sitables) {
      if (Math.hypot(player.position.x - s.position.x, player.position.z - s.position.z) < 1.8) { nearSit = true; break; }
    }
  }
  const hint = document.getElementById('interactHint');
  if (nearSit) { hint.textContent = '🪑 Oturmak için E'; hint.classList.add('show'); }
  else hint.classList.remove('show');

  const target = new THREE.Vector3(player.position.x, player.position.y + 0.9, player.position.z);
  controls.target.lerp(target, 1 - Math.pow(0.001, dt));
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (player) update(dt);
  controls.update();
  composer.render();
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth, innerHeight);
});

if (window.visualViewport) {
  const vv = window.visualViewport;
  const upd = () => {
    const kb = Math.max(0, innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty('--kb', kb + 'px');
  };
  vv.addEventListener('resize', upd); vv.addEventListener('scroll', upd);
}

/* ================================================================
   BAŞLAT
   ================================================================ */
async function init() {
  await preloadAllModels();
  updateLoader(1, 'Hazır!');

  player = createCharacter(playerState);
  player.position.set(0, 0, 4);
  scene.add(player);

  loadRoom('lobi');
  updateCoinUI();
  buildPanel();

  setTimeout(() => loaderEl.classList.add('hide'), 400);

  addChat(null, "Sanala Dünya 3D'ye hoş geldin! 🌟", 'sys');
  if (modelCache.girl) {
    addChat(null, '✓ girl.glb başarıyla yüklendi!', 'sys');
  } else {
    addChat(null, '⚠ girl.glb yüklenemedi — prosedürel karakter kullanılıyor.', 'sys');
    addChat(null, 'F12 konsolunda hatayı kontrol edin.', 'sys');
  }
  addChat(null, 'WASD / joystick ile yürü. Sağ üstten karakter ve mağaza.', 'sys');

  animate();
}

init().catch(err => {
  console.error(err);
  const el = document.getElementById('error');
  el.style.display = 'block';
  el.textContent = 'Başlatma hatası:\n' + err.message + '\n\n' + err.stack;
});
</script>
